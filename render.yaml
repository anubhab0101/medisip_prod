# Single Free Render web service. Staff, worker and receipt processes run
# together; the public gateway sends each hostname to exactly one service.
previews:
  generation: off

services:
  - type: web
    name: medishop-unified
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node scripts/start-all.mjs
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: SINGLE_SERVICE_MODE
        value: "true"
      - key: PORT
        value: "10000"
      - key: LOCAL_PREVIEW
        value: "false"
      - key: ALLOW_DEMO_SEED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: AUTH_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: JOB_SIGNATURE_KEY
        sync: false
      - key: PLATFORM_ADMIN_EMAILS
        sync: false
      - key: INTEGRATION_ENCRYPTION_KEY
        sync: false
      - key: RECEIPT_PUBLIC_URL
        sync: false
      - key: RECEIPT_DATABASE_URL
        sync: false
      - key: RECEIPT_TOKEN_SECRET
        sync: false
      - key: SMS_SEND_ENABLED
        value: "false"
      - key: EVOLUTION_GO_SEND_ENABLED
        value: "false"
      # Free service disks are ephemeral; do not imply local backup durability.
      - key: DAILY_BACKUP_ENABLED
        value: "false"
